server.port=8080
spring.datasource.url=jdbc:sqlite:data.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT
matir.bank.jwt.secret=MatirBankJwtSuperSecretKey2024ThisMustBeAtLeast256BitsLong!
matir.bank.jwt.expiration-ms=86400000

# Key Service (Space 1) connection
matir.bank.keyservice.url=http://localhost:8081
matir.bank.keyservice.secret=MatirBankSuperSecretSharedKey123!

# System defaults (overridable via DB config)
matir.bank.default.max-customers=1000
matir.bank.default.savings-interest-rate=5.0
